server.port: 7002
spring.web.error.include-message: always   # 🔧 교재: server.error.include-message (Boot 4에서 적용 안 됨)

spring.mongodb:   # 🔧 교재 spring.data.mongodb
  host: localhost
  port: 27017
  database: product-db

spring.data.mongodb.auto-index-creation: true   # ✅ 이 속성은 spring.data 그대로

logging:
  level:
    root: INFO
    se.magnus: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

---
spring.config.activate.on-profile: docker

server.port: 8080

spring.mongodb.host: mongodb   # 🔧 docker-compose의 서비스 이름